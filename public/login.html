<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Betawin | Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #05050b;
      overflow: hidden;
    }

    /* FOOTBALL BACKGROUND */

    body::before {
      content: "";
      position: fixed;
      inset: 0;

      background:
        linear-gradient(
          rgba(4,4,12,.82),
          rgba(4,4,12,.94)
        ),
        url("images/betawin-footballe4.jpg");

      background-size: cover;
      background-position: center;

      z-index: -2;
    }

    /* PINK + BLUE GLOW */

    body::after {
      content: "";
      position: fixed;
      inset: 0;

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(255,20,147,.25),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(0,123,255,.25),
          transparent 30%
        );

      z-index: -1;
      pointer-events: none;
    }

    .login-box {
      width: 100%;
      max-width: 420px;

      padding: 32px 28px;

      background: rgba(8,8,18,.78);

      border: 1px solid rgba(255,255,255,.12);

      border-radius: 22px;

      backdrop-filter: blur(18px);

      box-shadow:
        0 20px 70px rgba(0,0,0,.5);
    }

    .logo {
      text-align: center;

      font-size: 32px;
      font-weight: 900;

      margin-bottom: 8px;

      background:
        linear-gradient(
          90deg,
          #ff1493,
          #9b2cff,
          #008cff
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;

      color: #ddd;

      font-size: 13px;
      font-weight: bold;

      margin-bottom: 8px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    input {
      width: 100%;

      padding: 15px;

      border-radius: 12px;

      border: 1px solid rgba(255,255,255,.14);

      outline: none;

      background: rgba(255,255,255,.06);

      color: #fff;

      font-size: 15px;

      transition: .2s;
    }

    input::placeholder {
      color: #777;
    }

    input:focus {
      border-color: #ff1493;

      box-shadow:
        0 0 0 3px rgba(255,20,147,.10);
    }

    .password-row {
      position: relative;
    }

    .show-password {
      position: absolute;

      right: 13px;
      top: 50%;

      transform: translateY(-50%);

      background: none;
      border: none;

      color: #aaa;

      cursor: pointer;

      font-size: 12px;
    }

    .forgot {
      display: block;

      text-align: right;

      margin-top: -8px;
      margin-bottom: 20px;

      color: #ff69b4;

      text-decoration: none;

      font-size: 13px;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .login-button {
      width: 100%;

      padding: 15px;

      border: none;

      border-radius: 13px;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      background:
        linear-gradient(
          90deg,
          #ff1493,
          #007bff
        );

      box-shadow:
        0 10px 25px rgba(255,20,147,.18);

      transition: .25s;
    }

    .login-button:hover {
      transform: translateY(-2px);
    }

    .login-button:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;

      margin-top: 15px;
      padding: 11px;

      border-radius: 10px;

      text-align: center;

      font-size: 13px;
    }

    .message.error {
      display: block;

      color: #ff9b9b;

      background: rgba(255,0,0,.08);

      border: 1px solid rgba(255,0,0,.15);
    }

    .message.success {
      display: block;

      color: #8fffc1;

      background: rgba(0,255,130,.08);

      border: 1px solid rgba(0,255,130,.15);
    }

    .register-text {
      text-align: center;

      color: #888;

      font-size: 14px;

      margin-top: 22px;
    }

    .register-text a {
      color: #ff69b4;

      text-decoration: none;

      font-weight: bold;
    }

    .home {
      display: block;

      text-align: center;

      margin-top: 20px;

      color: #777;

      text-decoration: none;

      font-size: 13px;
    }

    .home:hover {
      color: #fff;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      BETAWIN
    </div>

    <p class="subtitle">
      Login to your account
    </p>

    <form id="loginForm">

      <div class="input-group">

        <label for="phone">
          Phone Number
        </label>

        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="07XXXXXXXX"
          autocomplete="tel"
          required
        >

      </div>


      <div class="input-group">

        <label for="password">
          Password
        </label>

        <div class="password-row">

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-password"
            id="showPassword"
          >
            SHOW
          </button>

        </div>

      </div>


      <a
        href="forgot-password.html"
        class="forgot"
      >
        Forgot password?
      </a>


      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >
        Login
      </button>

      <div
        id="message"
        class="message"
      ></div>

    </form>


    <div class="register-text">

      Don't have an account?

      <a href="register.html">
        Register
      </a>

    </div>


    <a
      href="index.html"
      class="home"
    >
      ← Back to Betawin
    </a>

  </div>


  <script>

    const form =
      document.getElementById("loginForm");

    const button =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");

    const password =
      document.getElementById("password");

    const showPassword =
      document.getElementById("showPassword");


    /* SHOW / HIDE PASSWORD */

    showPassword.addEventListener("click", () => {

      if (password.type === "password") {

        password.type = "text";

        showPassword.textContent = "HIDE";

      } else {

        password.type = "password";

        showPassword.textContent = "SHOW";

      }

    });


    /* LOGIN */

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      message.className = "message";
      message.textContent = "";

      const phone =
        document.getElementById("phone").value.trim();

      const passwordValue =
        password.value;


      if (!phone || !passwordValue) {

        message.className =
          "message error";

        message.textContent =
          "Please enter your phone number and password.";

        return;
      }


      button.disabled = true;

      button.textContent =
        "Logging in...";


      try {

        const response = await fetch(
          "/api/auth/login",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              phone: phone,
              password: passwordValue
            })
          }
        );


        const data =
          await response.json().catch(() => ({}));


        if (!response.ok) {

          throw new Error(
            data.message ||
            data.error ||
            "Login failed. Please check your details."
          );

        }


        /*
          Accept common backend token names.
        */

        const token =
          data.token ||
          data.accessToken ||
          data.data?.token;


        if (!token) {

          throw new Error(
            "Login succeeded, but the server did not return a token."
          );

        }


        /* SAVE AUTH TOKEN */

        localStorage.setItem(
          "token",
          token
        );


        if (data.user) {

          localStorage.setItem(
            "user",
            JSON.stringify(data.user)
          );

        }


        message.className =
          "message success";

        message.textContent =
          "Login successful. Opening dashboard...";


        setTimeout(() => {

          window.location.href =
            "dashboard.html";

        }, 700);


      } catch (error) {

        message.className =
          "message error";

        message.textContent =
          error.message ||
          "Unable to connect to the server.";

        button.disabled = false;

        button.textContent =
          "Login";

      }

    });

  </script>

</body>
          </html>
