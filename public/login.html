<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Betawin - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      background:
        radial-gradient(circle at top left, #193d5c, transparent 40%),
        radial-gradient(circle at bottom right, #46164c, transparent 40%),
        #080d13;

      color: #fff;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;

      background: rgba(18, 26, 36, 0.97);
      border: 1px solid #293949;
      border-radius: 22px;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, .5);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #b4ff39;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9aa8b5;
      margin-bottom: 30px;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.error {
      display: block;
      color: #ff9a9a;
      background: rgba(255, 50, 50, .1);
      border: 1px solid rgba(255, 80, 80, .3);
    }

    .message.success {
      display: block;
      color: #b9ff9d;
      background: rgba(80, 255, 80, .08);
      border: 1px solid rgba(80, 255, 80, .25);
    }

    .field {
      margin-bottom: 19px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: #dce5ed;
      font-size: 14px;
    }

    .field input {
      width: 100%;
      padding: 15px;

      background: #0b131c;
      color: white;

      border: 1px solid #304152;
      border-radius: 12px;

      outline: none;
      font-size: 16px;
    }

    .field input:focus {
      border-color: #b4ff39;
      box-shadow: 0 0 0 2px rgba(180,255,57,.1);
    }

    .forgot {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 20px;
    }

    .forgot a {
      color: #b4ff39;
      text-decoration: none;
      font-size: 14px;
    }

    .login-btn {
      width: 100%;
      padding: 15px;

      border: none;
      border-radius: 12px;

      background: #b4ff39;
      color: #071008;

      font-size: 17px;
      font-weight: 800;

      cursor: pointer;
    }

    .login-btn:hover {
      filter: brightness(1.05);
    }

    .login-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .register {
      text-align: center;
      margin-top: 24px;
      color: #9aa8b5;
      font-size: 14px;
    }

    .register a {
      color: #b4ff39;
      font-weight: bold;
      text-decoration: none;
    }

    .security {
      text-align: center;
      color: #687784;
      font-size: 12px;
      margin-top: 22px;
    }
  </style>
</head>

<body>

  <main class="login-box">

    <div class="logo">BETAWIN</div>

    <div class="subtitle">
      Welcome back. Login to continue.
    </div>

    <div id="message" class="message"></div>

    <form id="loginForm">

      <div class="field">
        <label for="phone">Phone Number</label>

        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="07XXXXXXXX"
          autocomplete="tel"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
      </div>

      <div class="forgot">
        <a href="/forgot-password.html">
          Forgot password?
        </a>
      </div>

      <button
        type="submit"
        class="login-btn"
        id="loginBtn"
      >
        Login
      </button>

    </form>

    <div class="register">
      Don't have an account?
      <a href="/register.html">Create account</a>
    </div>

    <div class="security">
      🔒 Your password is securely protected.
    </div>

  </main>


  <script>
    const form = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const phone = document
        .getElementById("phone")
        .value
        .trim();

      const password = document
        .getElementById("password")
        .value;

      if (!phone || !password) {
        showMessage(
          "Please enter your phone number and password.",
          "error"
        );
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";

      message.className = "message";

      try {

        const response = await fetch("/api/auth/login", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            phone,
            password
          })
        });

        const data = await response.json();

        if (!response.ok) {

          showMessage(
            data.message || "Invalid login details.",
            "error"
          );

          loginBtn.disabled = false;
          loginBtn.textContent = "Login";

          return;
        }

        /*
         * Save authentication token.
         */
        localStorage.setItem(
          "token",
          data.token
        );

        /*
         * Save basic user information.
         */
        if (data.user) {
          localStorage.setItem(
            "user",
            JSON.stringify(data.user)
          );
        }

        showMessage(
          "Login successful. Redirecting...",
          "success"
        );

        setTimeout(() => {
          window.location.href = "/dashboard.html";
        }, 700);

      } catch (error) {

        console.error("Login error:", error);

        showMessage(
          "Unable to connect to the server. Please try again.",
          "error"
        );

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
      }
    });
  </script>

</body>
  </html>
