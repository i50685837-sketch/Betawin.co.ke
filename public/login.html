<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Betawin — Log In</title>
<style>
  :root{
    --bg:#0A0E12; --panel:#141C26; --line:#223040; --lime:#B4FF39; --lime-dim:#8FDB1E;
    --text:#EDF2F7; --muted:#7C8998; --muted-2:#4E5B6B; --danger:#FF6B6B;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif; height:100%; overflow-x:hidden;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  a{color:inherit; text-decoration:none;}
  input{font-family:inherit;}

  body{
    background:
      radial-gradient(55% 40% at 85% 0%, rgba(180,255,57,0.09), transparent 60%),
      radial-gradient(50% 35% at 0% 100%, rgba(45,212,191,0.07), transparent 60%),
      var(--bg);
  }

  .wrap{max-width:400px; margin:0 auto; padding:64px 24px 40px; min-height:100vh; display:flex; flex-direction:column; justify-content:center;}

  .brand{display:flex; flex-direction:column; align-items:center; margin-bottom:34px; animation:fadeSlideUp .5s ease both;}
  .brand-mark{
    width:56px; height:56px; border-radius:16px; background:linear-gradient(150deg, var(--lime), var(--lime-dim));
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:24px; color:#0A0E12;
    box-shadow:0 0 28px rgba(180,255,57,0.28); margin-bottom:14px;
    animation:float 3.4s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);}}
  .brand-title{font-weight:800; font-size:20px; letter-spacing:.5px;}
  .brand-sub{font-size:12.5px; color:var(--muted); margin-top:4px;}

  .field-group{margin-bottom:16px; animation:fadeSlideUp .5s ease both;}
  .field-group:nth-of-type(1){animation-delay:.05s;}
  .field-group:nth-of-type(2){animation-delay:.1s;}
  .field-label{font-size:12.5px; font-weight:700; margin-bottom:7px; display:block;}
  .phone-row{display:flex; gap:8px;}
  .phone-prefix{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; font-size:14px; font-weight:600; color:var(--muted); flex-shrink:0;}
  .field-input{
    width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; color:var(--text); font-size:15px; transition:border-color .15s, box-shadow .15s;
  }
  .field-input:focus{outline:none; border-color:var(--lime); box-shadow:0 0 0 3px rgba(180,255,57,0.1);}

  .pw-row{position:relative;}
  .pw-toggle{position:absolute; right:14px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--muted); font-weight:600;}

  .forgot-link{text-align:right; margin-bottom:22px; animation:fadeSlideUp .5s ease .12s both;}
  .forgot-link a{font-size:12.5px; color:var(--lime); font-weight:600;}

  .field-error{font-size:11.5px; color:var(--danger); margin:-10px 0 14px; display:none;}
  .field-error.show{display:block;}

  .login-btn{
    width:100%; background:var(--lime); color:#0A0E12; font-weight:700; font-size:15px;
    padding:15px; border-radius:13px; text-align:center; margin-bottom:22px;
    animation:fadeSlideUp .5s ease .16s both;
  }
  .login-btn:active{background:var(--lime-dim);}
  .login-btn.loading{opacity:0.7; pointer-events:none;}

  .divider{display:flex; align-items:center; gap:10px; margin-bottom:22px; animation:fadeSlideUp .5s ease .2s both;}
  .divider-line{flex:1; height:1px; background:var(--line);}
  .divider-text{font-size:11px; color:var(--muted-2); text-transform:uppercase; letter-spacing:1px;}

  .footer-link{text-align:center; font-size:13.5px; color:var(--muted); animation:fadeSlideUp .5s ease .24s both;}
  .footer-link a{color:var(--lime); font-weight:700;}

  .status-note{display:flex; align-items:center; gap:6px; justify-content:center; margin-top:26px; font-size:11px; color:var(--muted-2);}
  .status-dot{width:6px; height:6px; border-radius:50%; background:var(--muted-2);}
  .status-dot.online{background:var(--lime);}
  .status-dot.offline{background:var(--danger);}

  @keyframes fadeSlideUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <div class="brand-mark">B</div>
    <div class="brand-title">BETAWIN</div>
    <div class="brand-sub">Log in to your account</div>
  </div>

  <div class="field-group">
    <label class="field-label">Phone number</label>
    <div class="phone-row">
      <div class="phone-prefix">🇰🇪 +254</div>
      <input class="field-input" id="inputPhone" type="tel" placeholder="7XX XXX XXX" inputmode="numeric" autocomplete="tel" />
    </div>
  </div>
  <div class="field-error" id="errPhone">Enter a valid Kenyan phone number</div>

  <div class="field-group">
    <label class="field-label">Password</label>
    <div class="pw-row">
      <input class="field-input" id="inputPassword" type="password" placeholder="Your password" autocomplete="current-password" />
      <button class="pw-toggle" id="pwToggle">Show</button>
    </div>
  </div>
  <div class="field-error" id="errPassword">Enter your password</div>

  <div class="forgot-link"><a href="forgot-password.html">Forgot password?</a></div>

  <button class="login-btn" id="loginBtn">Log In</button>

  <div class="divider"><div class="divider-line"></div><div class="divider-text">New here</div><div class="divider-line"></div></div>

  <div class="footer-link">Don't have an account? <a href="register.html">Create account</a></div>

  <div class="status-note">
    <span class="status-dot" id="connDot"></span>
    <span id="connText">Checking connection…</span>
  </div>
</div>

<script>
  const API_BASE = window.BETAWIN_API_BASE || 'http://localhost:5000';

  const pwInput = document.getElementById('inputPassword');
  document.getElementById('pwToggle').addEventListener('click', () => {
    const isPw = pwInput.type === 'password';
    pwInput.type = isPw ? 'text' : 'password';
    document.getElementById('pwToggle').textContent = isPw ? 'Hide' : 'Show';
  });

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const phone = document.getElementById('inputPhone').value.trim().replace(/\s+/g,'');
    const password = pwInput.value;

    const phoneOk = /^[71]\d{8}$/.test(phone);
    document.getElementById('errPhone').classList.toggle('show', !phoneOk);
    const pwOk = password.length > 0;
    document.getElementById('errPassword').classList.toggle('show', !pwOk);
    if(!phoneOk || !pwOk) return;

    const btn = document.getElementById('loginBtn');
    btn.classList.add('loading');
    btn.textContent = 'Logging in…';

    try{
      const res = await fetch(API_BASE + '/api/auth/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ phone: '254'+phone, password })
      });
      if(!res.ok) throw new Error('Invalid credentials');
      const result = await res.json();
      if(result.token) localStorage.setItem('betawin_token', result.token);
      if(result.user) localStorage.setItem('betawin_user', JSON.stringify(result.user));
      btn.textContent = 'Welcome back ✓';
      setTimeout(() => window.location.href = 'index.html', 700);
    } catch(e){
      btn.classList.remove('loading');
      btn.textContent = 'Log In';
      document.getElementById('errPassword').textContent = 'Could not log in — check your details or try again once the backend is connected';
      document.getElementById('errPassword').classList.add('show');
    }
  });

  async function pollHealth(){
    const dot = document.getElementById('connDot'), txt = document.getElementById('connText');
    try{
      const res = await fetch(API_BASE + '/health');
      if(!res.ok) throw new Error();
      dot.className = 'status-dot online'; txt.textContent = 'Connected';
    } catch(e){ dot.className = 'status-dot offline'; txt.textContent = 'Offline — retrying…'; }
  }
  pollHealth(); setInterval(pollHealth, 15000);
</script>

</body>
  </html>
