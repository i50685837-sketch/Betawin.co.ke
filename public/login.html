<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Betawin | Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #05050b;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;

      background:
        linear-gradient(
          rgba(4,4,12,.82),
          rgba(4,4,12,.94)
        ),
        url("images/betawin-footballe4.jpg");

      background-size: cover;
      background-position: center;

      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(255,20,147,.25),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(0,123,255,.25),
          transparent 30%
        );

      z-index: -1;
      pointer-events: none;
    }

    .login-box {
      width: 100%;
      max-width: 420px;

      padding: 32px 28px;

      background: rgba(8,8,18,.80);

      border: 1px solid rgba(255,255,255,.12);

      border-radius: 22px;

      backdrop-filter: blur(18px);

      box-shadow:
        0 20px 70px rgba(0,0,0,.5);
    }

    .logo {
      text-align: center;

      font-size: 32px;
      font-weight: 900;

      margin-bottom: 8px;

      background:
        linear-gradient(
          90deg,
          #ff1493,
          #9b2cff,
          #008cff
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;

      color: #999;

      font-size: 14px;

      margin-bottom: 28px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;

      color: #ddd;

      font-size: 13px;
      font-weight: bold;

      margin-bottom: 8px;
    }

    input {
      width: 100%;

      padding: 15px;

      border-radius: 12px;

      border: 1px solid rgba(255,255,255,.14);

      outline: none;

      background: rgba(255,255,255,.06);

      color: #fff;

      font-size: 15px;

      transition: .2s;
    }

    input::placeholder {
      color: #777;
    }

    input:focus {
      border-color: #ff1493;

      box-shadow:
        0 0 0 3px rgba(255,20,147,.10);
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 65px;
    }

    .show-password {
      position: absolute;

      right: 12px;
      top: 50%;

      transform: translateY(-50%);

      border: none;

      background: transparent;

      color: #aaa;

      cursor: pointer;

      font-size: 11px;
      font-weight: bold;
    }

    .forgot {
      display: block;

      text-align: right;

      margin-top: -7px;
      margin-bottom: 20px;

      color: #ff69b4;

      text-decoration: none;

      font-size: 13px;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .login-button {
      width: 100%;

      padding: 15px;

      border: none;

      border-radius: 13px;

      color: #fff;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      background:
        linear-gradient(
          90deg,
          #ff1493,
          #007bff
        );

      box-shadow:
        0 10px 25px rgba(255,20,147,.18);

      transition: .25s;
    }

    .login-button:hover {
      transform: translateY(-2px);
    }

    .login-button:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;

      margin-top: 15px;

      padding: 11px;

      border-radius: 10px;

      text-align: center;

      font-size: 13px;

      line-height: 1.4;
    }

    .message.error {
      display: block;

      color: #ff9b9b;

      background: rgba(255,0,0,.08);

      border: 1px solid rgba(255,0,0,.15);
    }

    .message.success {
      display: block;

      color: #8fffc1;

      background: rgba(0,255,130,.08);

      border: 1px solid rgba(0,255,130,.15);
    }

    .register-text {
      text-align: center;

      color: #888;

      font-size: 14px;

      margin-top: 22px;
    }

    .register-text a {
      color: #ff69b4;

      text-decoration: none;

      font-weight: bold;
    }

    .home {
      display: block;

      text-align: center;

      margin-top: 20px;

      color: #777;

      text-decoration: none;

      font-size: 13px;
    }

    .home:hover {
      color: #fff;
    }

    .loading {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .spinner {
      width: 15px;
      height: 15px;

      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;

      border-radius: 50%;

      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 480px) {
      .login-box {
        padding: 27px 20px;
      }

      .logo {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      BETAWIN
    </div>

    <p class="subtitle">
      Login to your account
    </p>


    <form id="loginForm">

      <!-- PHONE -->

      <div class="input-group">

        <label for="phone">
          Phone Number
        </label>

        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="07XXXXXXXX"
          autocomplete="tel"
          inputmode="tel"
          required
        >

      </div>


      <!-- PASSWORD -->

      <div class="input-group">

        <label for="password">
          Password
        </label>

        <div class="password-box">

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-password"
            id="showPassword"
          >
            SHOW
          </button>

        </div>

      </div>


      <!-- FORGOT -->

      <a
        href="forgot-password.html"
        class="forgot"
      >
        Forgot password?
      </a>


      <!-- LOGIN BUTTON -->

      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >
        Login
      </button>


      <!-- MESSAGE -->

      <div
        id="message"
        class="message"
      ></div>

    </form>


    <!-- REGISTER -->

    <div class="register-text">

      Don't have an account?

      <a href="register.html">
        Register
      </a>

    </div>


    <!-- HOME -->

    <a
      href="index.html"
      class="home"
    >
      ← Back to Betawin
    </a>

  </div>


<script>

/* =========================================
   CONFIGURATION
========================================= */

const API_BASE =
  window.BETAWIN_API_BASE || "";


/* =========================================
   ELEMENTS
========================================= */

const form =
  document.getElementById("loginForm");

const phoneInput =
  document.getElementById("phone");

const passwordInput =
  document.getElementById("password");

const loginButton =
  document.getElementById("loginButton");

const message =
  document.getElementById("message");

const showPassword =
  document.getElementById("showPassword");


/* =========================================
   CLEAR OLD AUTH DATA
========================================= */

function clearOldAuth(){

  localStorage.removeItem("token");
  localStorage.removeItem("accessToken");

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(text, type){

  message.className =
    "message " + type;

  message.textContent =
    text;

}


/* =========================================
   SHOW / HIDE PASSWORD
========================================= */

showPassword.addEventListener(
  "click",
  function(){

    if(
      passwordInput.type === "password"
    ){

      passwordInput.type =
        "text";

      showPassword.textContent =
        "HIDE";

    }else{

      passwordInput.type =
        "password";

      showPassword.textContent =
        "SHOW";

    }

  }
);


/* =========================================
   LOGIN
========================================= */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const phone =
      phoneInput.value.trim();

    const password =
      passwordInput.value;


    /* VALIDATION */

    if(!phone){

      showMessage(
        "Please enter your phone number.",
        "error"
      );

      phoneInput.focus();

      return;
    }


    if(!password){

      showMessage(
        "Please enter your password.",
        "error"
      );

      passwordInput.focus();

      return;
    }


    /* BUTTON LOADING */

    loginButton.disabled =
      true;

    loginButton.innerHTML = `
      <span class="loading">
        <span class="spinner"></span>
        Logging in...
      </span>
    `;


    message.className =
      "message";

    message.textContent =
      "";


    try{

      /*
        IMPORTANT:

        This must match your Express route:

        POST /api/auth/login
      */

      const response =
        await fetch(
          API_BASE +
          "/api/auth/login",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "Accept":
                "application/json"
            },

            body: JSON.stringify({
              phone: phone,
              password: password
            })
          }
        );


      const data =
        await response
          .json()
          .catch(() => null);


      console.log(
        "LOGIN RESPONSE:",
        response.status,
        data
      );


      /* SERVER ERROR */

      if(!response.ok){

        throw new Error(
          data?.message ||
          "Invalid phone number or password."
        );

      }


      /* BACKEND MUST RETURN TOKEN */

      const token =
        data?.token ||
        data?.accessToken ||
        data?.data?.token;


      if(!token){

        throw new Error(
          "Login succeeded, but no authentication token was returned."
        );

      }


      /*
        IMPORTANT FIX

        dashboard.html expects:

        betawin_token

        NOT:

        token
      */

      localStorage.setItem(
        "betawin_token",
        token
      );


      /* SAVE USER */

      if(data.user){

        localStorage.setItem(
          "betawin_user",
          JSON.stringify(
            data.user
          )
        );

      }


      /*
        Remove old incompatible
        authentication keys.
      */

      localStorage.removeItem(
        "token"
      );

      localStorage.removeItem(
        "accessToken"
      );


      /* SUCCESS */

      showMessage(
        "Login successful. Opening dashboard...",
        "success"
      );


      /*
        Give the browser a moment
        to save localStorage.
      */

      setTimeout(
        function(){

          window.location.replace(
            "dashboard.html"
          );

        },
        500
      );


    }catch(error){

      console.error(
        "LOGIN ERROR:",
        error
      );


      showMessage(
        error.message ||
        "Unable to connect to the server.",
        "error"
      );


      loginButton.disabled =
        false;

      loginButton.textContent =
        "Login";

    }

  }
);


/* =========================================
   IF ALREADY LOGGED IN
========================================= */

async function checkExistingLogin(){

  const existingToken =
    localStorage.getItem(
      "betawin_token"
    );


  if(!existingToken){

    return;

  }


  try{

    const response =
      await fetch(
        API_BASE +
        "/api/auth/me",
        {
          method:"GET",

          headers:{
            "Authorization":
              "Bearer " +
              existingToken,

            "Accept":
              "application/json"
          }
        }
      );


    if(response.ok){

      /*
        User already has a valid
        session, so don't show
        login unnecessarily.
      */

      window.location.replace(
        "dashboard.html"
      );

    }else{

      localStorage.removeItem(
        "betawin_token"
      );

      localStorage.removeItem(
        "betawin_user"
      );

    }

  }catch(error){

    console.log(
      "Existing session check skipped."
    );

  }

}


/* =========================================
   START
========================================= */

checkExistingLogin();

</script>

</body>
</html>
