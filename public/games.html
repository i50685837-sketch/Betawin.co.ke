<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Betawin — Games</title>
<style>
  :root{
    --bg:#0A0E12; --panel:#141C26; --line:#223040; --lime:#B4FF39;
    --text:#EDF2F7; --muted:#7C8998; --muted-2:#4E5B6B; --danger:#FF6B6B;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif; height:100%;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  a{color:inherit; text-decoration:none;}

  .topbar{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:14px 16px; background:rgba(10,14,18,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
  .icon-btn{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--panel); border:1px solid var(--line);}
  .icon-btn svg{width:19px; height:19px; stroke:var(--text);}
  .topbar-title{font-weight:700; font-size:16px;}

  .main{padding:18px 16px 90px; max-width:520px; margin:0 auto;}
  .intro-sub{font-size:12.5px; color:var(--muted); margin-bottom:18px;}

  .game-grid{display:flex; flex-direction:column; gap:12px;}
  .game-card{
    position:relative; overflow:hidden;
    display:flex; align-items:center; gap:14px;
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:16px; transition:border-color .15s, transform .1s;
  }
  .game-card:active{transform:scale(0.98);}
  .game-card.ready{border-color:rgba(180,255,57,0.3);}
  .game-icon{
    width:52px; height:52px; border-radius:13px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:24px;
  }
  .game-icon.crash{background:linear-gradient(145deg, rgba(255,107,107,0.18), rgba(255,107,107,0.06));}
  .game-icon.casino{background:linear-gradient(145deg, rgba(244,197,66,0.18), rgba(244,197,66,0.06));}
  .game-icon.roulette{background:linear-gradient(145deg, rgba(180,255,57,0.18), rgba(180,255,57,0.06));}
  .game-body{flex:1; min-width:0;}
  .game-title{font-weight:700; font-size:15px;}
  .game-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .game-status{
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
    color:var(--muted-2); margin-top:6px;
  }
  .game-card.ready .game-status{color:var(--lime);}
  .game-arrow{color:var(--muted-2); font-size:16px; flex-shrink:0;}
  .game-card.ready .game-arrow{color:var(--lime);}

  .status-note{display:flex; align-items:center; gap:6px; justify-content:center; margin-top:22px; font-size:11px; color:var(--muted-2);}
  .status-dot{width:6px; height:6px; border-radius:50%; background:var(--muted-2);}
  .status-dot.online{background:var(--lime);}
  .status-dot.offline{background:var(--danger);}
</style>
</head>
<body>

<header class="topbar">
  <button class="back" onclick="history.back()">‹</button>
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="topbar-title">Games</div>
</header>

<main class="main">
  <div class="intro-sub">Pick a game to play. Cards light up once their page is added to <code>pages/</code>.</div>

  <div class="game-grid">
    <a class="game-card" data-page="crash.html">
      <div class="game-icon crash">🚀</div>
      <div class="game-body">
        <div class="game-title">Crash</div>
        <div class="game-sub">Cash out before it crashes</div>
        <div class="game-status" data-status>Coming soon</div>
      </div>
      <div class="game-arrow">→</div>
    </a>

    <a class="game-card" data-page="casino.html">
      <div class="game-icon casino">🎰</div>
      <div class="game-body">
        <div class="game-title">Casino</div>
        <div class="game-sub">Slots &amp; table games</div>
        <div class="game-status" data-status>Coming soon</div>
      </div>
      <div class="game-arrow">→</div>
    </a>

    <a class="game-card" data-page="roulette.html">
      <div class="game-icon roulette">🎡</div>
      <div class="game-body">
        <div class="game-title">Roulette</div>
        <div class="game-sub">Bet on the wheel</div>
        <div class="game-status" data-status>Coming soon</div>
      </div>
      <div class="game-arrow">→</div>
    </a>
  </div>

  <div class="status-note">
    <span class="status-dot" id="connDot"></span>
    <span id="connText">Checking connection…</span>
  </div>
</main>

<script>
  const API_BASE = window.BETAWIN_API_BASE || 'http://localhost:5000';
  const token = localStorage.getItem('betawin_token');
  function authHeaders(){ return token ? { 'Authorization': 'Bearer ' + token } : {}; }

  // Light up + link each game card once its page exists in pages/
  document.querySelectorAll('.game-card').forEach(card => {
    const target = card.dataset.page;
    fetch(target, { method: 'HEAD' })
      .then(res => {
        if(res.ok){
          card.classList.add('ready');
          card.querySelector('[data-status]').textContent = 'Play now →';
          card.addEventListener('click', () => window.location.href = target);
        }
      })
      .catch(() => { /* stays "Coming soon" until the file lands */ });
  });

  async function pollHealth(){
    const dot = document.getElementById('connDot'), txt = document.getElementById('connText');
    try{
      const res = await fetch(API_BASE + '/health', { headers: authHeaders() });
      if(!res.ok) throw new Error();
      dot.className = 'status-dot online'; txt.textContent = 'Connected';
    } catch(e){ dot.className = 'status-dot offline'; txt.textContent = 'Offline — retrying…'; }
  }
  pollHealth(); setInterval(pollHealth, 15000);
</script>

</body>
</html>
