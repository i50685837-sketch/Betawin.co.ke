<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Betawin — My Activity</title>
<style>
  :root{
    --bg:#0A0E12; --panel:#141C26; --line:#223040; --lime:#B4FF39;
    --text:#EDF2F7; --muted:#7C8998; --muted-2:#4E5B6B; --danger:#FF6B6B; --warn:#F4C542;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif; height:100%;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  a{color:inherit; text-decoration:none;}

  .topbar{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:14px 16px; background:rgba(10,14,18,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
  .icon-btn{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--panel); border:1px solid var(--line);}
  .icon-btn svg{width:19px; height:19px; stroke:var(--text);}
  .topbar-title{font-weight:700; font-size:16px;}

  .main{padding:18px 16px 90px; max-width:520px; margin:0 auto;}

  .filter-row{display:flex; gap:8px; margin-bottom:16px; overflow-x:auto;}
  .filter-chip{
    flex-shrink:0; padding:8px 15px; border-radius:20px; font-size:12.5px; font-weight:600;
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
  }
  .filter-chip.active{background:var(--lime); color:#0A0E12; border-color:var(--lime);}

  .empty-state{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    background:var(--panel); border:1px dashed var(--line); border-radius:16px;
    padding:44px 24px; margin-top:8px;
  }
  .empty-icon{font-size:28px; margin-bottom:10px; opacity:.8;}
  .empty-title{font-weight:700; font-size:14.5px; margin-bottom:6px;}
  .empty-sub{font-size:12px; color:var(--muted); max-width:280px; line-height:1.6;}

  .activity-list{display:flex; flex-direction:column; gap:10px;}
  .activity-card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; align-items:center; gap:12px;}
  .a-icon{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
  .a-icon.win{background:rgba(180,255,57,0.1);}
  .a-icon.loss{background:rgba(255,107,107,0.1);}
  .a-icon.pending{background:rgba(244,197,66,0.1);}
  .a-body{flex:1; min-width:0;}
  .a-title{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .a-time{font-size:11px; color:var(--muted); margin-top:2px;}
  .a-amt{font-size:13.5px; font-weight:700; font-family:ui-monospace, monospace; flex-shrink:0;}
  .a-amt.pos{color:var(--lime);}
  .a-amt.neg{color:var(--danger);}
  .a-amt.pending{color:var(--warn);}

  .status-note{display:flex; align-items:center; gap:6px; justify-content:center; margin-top:20px; font-size:11px; color:var(--muted-2);}
  .status-dot{width:6px; height:6px; border-radius:50%; background:var(--muted-2);}
  .status-dot.online{background:var(--lime);}
  .status-dot.offline{background:var(--danger);}
</style>
</head>
<body>

<header class="topbar">
  <button class="icon-btn" onclick="window.location.href='index.html'" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="topbar-title">My Activity</div>
</header>

<main class="main">
  <div class="filter-row">
    <div class="filter-chip active" data-filter="all">All</div>
    <div class="filter-chip" data-filter="bets">Bets</div>
    <div class="filter-chip" data-filter="deposits">Deposits</div>
    <div class="filter-chip" data-filter="withdrawals">Withdrawals</div>
  </div>

  <div id="listWrap"></div>

  <div class="status-note">
    <span class="status-dot" id="connDot"></span>
    <span id="connText">Checking connection…</span>
  </div>
</main>

<script>
  const API_BASE = window.BETAWIN_API_BASE || 'http://localhost:5000';
  const token = localStorage.getItem('betawin_token');
  function authHeaders(){ return token ? { 'Authorization': 'Bearer ' + token } : {}; }

  const listWrap = document.getElementById('listWrap');
  let items = [];
  let currentFilter = 'all';

  function iconFor(type, status){
    if(type === 'bet') return status === 'won' ? '⚽' : status === 'lost' ? '⚽' : '⏳';
    if(type === 'deposit') return '⬆️';
    if(type === 'withdrawal') return '⬇️';
    return '•';
  }
  function classFor(status){
    if(status === 'won' || status === 'completed') return 'win';
    if(status === 'lost' || status === 'failed') return 'loss';
    return 'pending';
  }
  function amtClassFor(status, amount){
    if(status === 'pending') return 'pending';
    return amount >= 0 ? 'pos' : 'neg';
  }

  function render(){
    const filtered = items.filter(i => currentFilter === 'all' || i.type === currentFilter.slice(0,-1) || (currentFilter === 'bets' && i.type === 'bet') || (currentFilter === 'deposits' && i.type === 'deposit') || (currentFilter === 'withdrawals' && i.type === 'withdrawal'));

    if(filtered.length === 0){
      listWrap.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <div class="empty-title">No activity yet</div>
          <div class="empty-sub">Your bets, deposits, and withdrawals will show up here once your account is connected to the backend.</div>
        </div>`;
      return;
    }

    listWrap.innerHTML = `<div class="activity-list">${filtered.map(i => `
      <div class="activity-card">
        <div class="a-icon ${classFor(i.status)}">${iconFor(i.type, i.status)}</div>
        <div class="a-body">
          <div class="a-title">${i.title}</div>
          <div class="a-time">${new Date(i.date).toLocaleString('en-KE', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}</div>
        </div>
        <div class="a-amt ${amtClassFor(i.status, i.amount)}">${i.amount >= 0 ? '+' : ''}KES ${Math.abs(i.amount).toLocaleString()}</div>
      </div>
    `).join('')}</div>`;
  }

  async function loadActivity(){
    try{
      const res = await fetch(API_BASE + '/api/activity', { headers: authHeaders() });
      if(!res.ok) throw new Error();
      const data = await res.json();
      items = data.items || [];
    } catch(e){
      items = []; // empty until backend is connected -- no fake data shown
    }
    render();
  }
  loadActivity();

  document.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentFilter = chip.dataset.filter;
      render();
    });
  });

  async function pollHealth(){
    const dot = document.getElementById('connDot'), txt = document.getElementById('connText');
    try{
      const res = await fetch(API_BASE + '/health', { headers: authHeaders() });
      if(!res.ok) throw new Error();
      dot.className = 'status-dot online'; txt.textContent = 'Connected';
    } catch(e){ dot.className = 'status-dot offline'; txt.textContent = 'Offline — retrying…'; }
  }
  pollHealth(); setInterval(pollHealth, 15000);
</script>

</body>
</html>
