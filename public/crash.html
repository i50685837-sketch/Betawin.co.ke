<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crash Games — Betawin</title>
<style>
  :root{
    --navy-900:#0a0e17; --navy-800:#101624; --navy-700:#161d2f; --navy-600:#1e2740;
    --line:#232c42; --lime:#c6ff3d; --lime-dim:#8fbf2c;
    --text:#eef1f8; --text-dim:#8891a7; --text-faint:#5a6379; --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--navy-900); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100vh; padding-bottom:40px;}
  .topbar{position:sticky; top:0; z-index:20; background:rgba(10,14,23,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:14px 16px;}
  .topbar-row{display:flex; align-items:center; gap:12px; max-width:720px; margin:0 auto;}
  .back-btn{width:34px; height:34px; background:var(--navy-800); border:1px solid var(--line); border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--text); cursor:pointer; text-decoration:none;}
  .page-title{font-size:17px; font-weight:800; display:flex; align-items:center; gap:8px;}

  main{max-width:720px; margin:0 auto; padding:16px;}

  .provider-tabs{display:flex; gap:8px; margin-bottom:18px; overflow-x:auto; scrollbar-width:none;}
  .provider-tabs::-webkit-scrollbar{display:none;}
  .ptab{
    flex:0 0 auto; padding:8px 16px; border-radius:999px;
    background:var(--navy-700); border:1px solid var(--line);
    color:var(--text-dim); font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .ptab.active{background:var(--lime); color:var(--navy-900); border-color:var(--lime);}

  .game-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
  }
  .game-tile{
    background:var(--navy-800); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; text-decoration:none; color:var(--text); cursor:pointer;
    display:flex; flex-direction:column;
  }
  .game-thumb{
    height:96px;
    display:flex; align-items:center; justify-content:center;
    font-size:34px;
    position:relative;
  }
  .game-thumb::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, transparent, rgba(0,0,0,0.25));
  }
  .game-info{padding:10px 12px 12px;}
  .game-name{font-size:13px; font-weight:700; margin-bottom:3px;}
  .game-provider{font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.04em;}

  .badge-hot{
    position:absolute; top:8px; left:8px; z-index:1;
    font-size:9px; font-weight:800; color:var(--navy-900);
    background:var(--lime); padding:2px 7px; border-radius:5px;
  }

  .section-label{
    font-size:12px; color:var(--text-dim); font-weight:700;
    text-transform:uppercase; letter-spacing:0.06em;
    padding:22px 4px 12px;
  }

  .rg-note{
    margin-top:24px;
    background:var(--navy-800); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; font-size:12px; color:var(--text-dim); line-height:1.5;
    display:flex; gap:10px; align-items:flex-start;
  }
  .rg-note .ri{font-size:16px; flex-shrink:0;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <a class="back-btn" href="dashboard.html">←</a>
    <div class="page-title">🚀 Crash Games</div>
  </div>
</div>

<main>
  <div class="provider-tabs" id="providerTabs">
    <div class="ptab active" data-provider="">All</div>
    <div class="ptab" data-provider="spribe">Spribe</div>
    <div class="ptab" data-provider="smartsoft">SmartSoft Gaming</div>
  </div>

  <div class="game-grid" id="gameGrid"></div>

  <div class="rg-note">
    <span class="ri">🛡️</span>
    <span>Crash games are high-speed and can lead to fast losses. Set a deposit limit in Settings, and use self-exclusion if you need a break.</span>
  </div>
</main>

<script>
  // Catalog metadata only — game engines are hosted by the providers (Spribe / SmartSoft Gaming)
  // and launched via their own API integration. No wagering logic lives in this page.
  const GAMES = [
    { name: "Aviator", provider: "spribe", providerLabel: "Spribe", icon: "✈️", color: "#1e2740", hot: true },
    { name: "Mines", provider: "spribe", providerLabel: "Spribe", icon: "💣", color: "#241e3a" },
    { name: "Plinko", provider: "spribe", providerLabel: "Spribe", icon: "🔵", color: "#1a2a3a" },
    { name: "Goal", provider: "spribe", providerLabel: "Spribe", icon: "⚽", color: "#1e3327" },
    { name: "Dice", provider: "spribe", providerLabel: "Spribe", icon: "🎲", color: "#33241e" },
    { name: "Hi-Lo", provider: "spribe", providerLabel: "Spribe", icon: "🃏", color: "#2a1e33" },
    { name: "Mini Roulette", provider: "spribe", providerLabel: "Spribe", icon: "🎡", color: "#1e2740" },
    { name: "Keno", provider: "spribe", providerLabel: "Spribe", icon: "🔢", color: "#241e3a" },
    { name: "Balloon", provider: "spribe", providerLabel: "Spribe", icon: "🎈", color: "#1a2a3a" },
    { name: "Hotline", provider: "spribe", providerLabel: "Spribe", icon: "☎️", color: "#33241e" },
    { name: "JetX", provider: "smartsoft", providerLabel: "SmartSoft Gaming", icon: "🚀", color: "#1e2740", hot: true },
    { name: "JetX3", provider: "smartsoft", providerLabel: "SmartSoft Gaming", icon: "🛸", color: "#241e3a" },
    { name: "Zeppelin", provider: "smartsoft", providerLabel: "SmartSoft Gaming", icon: "🎈", color: "#1a2a3a" },
    { name: "Cappadocia", provider: "smartsoft", providerLabel: "SmartSoft Gaming", icon: "🎆", color: "#33241e" },
    { name: "Rocketon", provider: "smartsoft", providerLabel: "SmartSoft Gaming", icon: "🪐", color: "#2a1e33" }
  ];

  let activeProvider = "";

  function renderGames(){
    const grid = document.getElementById("gameGrid");
    grid.innerHTML = "";

    const filtered = activeProvider ? GAMES.filter(g => g.provider === activeProvider) : GAMES;

    filtered.forEach(g => {
      const tile = document.createElement("a");
      tile.className = "game-tile";
      tile.href = `game.html?slug=${encodeURIComponent(g.name.toLowerCase().replace(/\s+/g, "-"))}&provider=${g.provider}`;
      tile.innerHTML = `
        <div class="game-thumb" style="background:${g.color};">
          ${g.hot ? '<span class="badge-hot">HOT</span>' : ""}
          <span>${g.icon}</span>
        </div>
        <div class="game-info">
          <div class="game-name">${g.name}</div>
          <div class="game-provider">${g.providerLabel}</div>
        </div>
      `;
      grid.appendChild(tile);
    });
  }

  document.getElementById("providerTabs").addEventListener("click", (e) => {
    const tab = e.target.closest(".ptab");
    if(!tab) return;
    document.querySelectorAll(".ptab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    activeProvider = tab.dataset.provider;
    renderGames();
  });

  renderGames();
</script>
</body>
</html>
