<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Betawin — Deposit</title>
<style>
  :root{
    --bg:#0A0E12; --panel:#141C26; --line:#223040; --lime:#B4FF39; --lime-dim:#8FDB1E;
    --text:#EDF2F7; --muted:#7C8998; --muted-2:#4E5B6B; --danger:#FF6B6B;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif; height:100%;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  a{color:inherit; text-decoration:none;}
  input{font-family:inherit;}

  .topbar{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:14px 16px; background:rgba(10,14,18,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
  .icon-btn{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--panel); border:1px solid var(--line);}
  .icon-btn svg{width:19px; height:19px; stroke:var(--text);}
  .topbar-title{font-weight:700; font-size:16px;}

  .main{padding:18px 16px 90px; max-width:520px; margin:0 auto;}

  .avail-card{display:flex; align-items:center; justify-content:space-between; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:18px;}
  .avail-label{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:1px;}
  .avail-value{font-size:16px; font-weight:700; margin-top:2px;}

  .field-label{font-size:12.5px; color:var(--muted); margin-bottom:8px; font-weight:600;}
  .amount-card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px 18px; margin-bottom:16px;}
  .amount-input-row{display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:14px;}
  .amount-cur{font-size:18px; font-weight:700; color:var(--muted);}
  .amount-input{flex:1; background:none; border:none; outline:none; color:var(--text); font-size:28px; font-weight:800; font-family:ui-monospace, monospace;}
  .amount-input::placeholder{color:var(--muted-2);}
  .limits-note{font-size:11.5px; color:var(--muted-2);}
  .limits-note b{color:var(--muted);}

  .chip-row{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .chip{flex:1; min-width:70px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 0; font-size:12.5px; font-weight:600; text-align:center; color:var(--muted);}
  .chip.active{border-color:var(--lime); color:var(--lime); background:rgba(180,255,57,0.08);}

  .phone-card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:16px;}
  .phone-row{display:flex; gap:8px;}
  .phone-prefix{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:14px; font-weight:600; color:var(--muted); flex-shrink:0;}
  .phone-input{flex:1; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px 14px; color:var(--text); font-size:14px;}
  .phone-input:focus{outline:none; border-color:var(--lime);}

  .error-msg{font-size:12px; color:var(--danger); margin:-8px 0 14px; display:none;}
  .error-msg.show{display:block;}

  .submit-btn{width:100%; background:var(--lime); color:#0A0E12; font-weight:700; font-size:14.5px; padding:15px; border-radius:12px; text-align:center; opacity:0.4; pointer-events:none; transition:opacity .15s;}
  .submit-btn.enabled{opacity:1; pointer-events:auto;}
  .submit-btn:active{background:var(--lime-dim);}

  /* STK waiting overlay */
  .stk-overlay{position:fixed; inset:0; background:rgba(10,14,18,0.9); backdrop-filter:blur(4px); z-index:50; display:none; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:24px;}
  .stk-overlay.show{display:flex;}
  .stk-phone{
    width:74px; height:74px; border-radius:50%; background:var(--panel); border:2px solid var(--lime);
    display:flex; align-items:center; justify-content:center; font-size:30px; margin-bottom:22px;
    animation:pulseRing 1.4s ease-in-out infinite;
  }
  @keyframes pulseRing{0%,100%{box-shadow:0 0 0 0 rgba(180,255,57,0.35);} 50%{box-shadow:0 0 0 14px rgba(180,255,57,0);}}
  .stk-title{font-size:17px; font-weight:700; margin-bottom:8px;}
  .stk-sub{font-size:13px; color:var(--muted); max-width:280px; line-height:1.6; margin-bottom:22px;}
  .stk-status{font-size:12px; color:var(--muted-2); display:flex; align-items:center; gap:8px;}
  .stk-spinner{width:14px; height:14px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--lime); animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .stk-cancel{margin-top:24px; font-size:12.5px; color:var(--muted); text-decoration:underline;}

  .stk-result{display:none; flex-direction:column; align-items:center;}
  .stk-result.show{display:flex;}
  .stk-result-icon{width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; margin-bottom:16px;}
  .stk-result-icon.success{background:rgba(180,255,57,0.12); color:var(--lime);}
  .stk-result-icon.failed{background:rgba(255,107,107,0.12); color:var(--danger);}
  .stk-close-btn{margin-top:20px; background:var(--panel); border:1px solid var(--line); color:var(--text); font-weight:600; font-size:13.5px; padding:11px 24px; border-radius:10px;}

  .status-note{display:flex; align-items:center; gap:6px; justify-content:center; margin-top:14px; font-size:11px; color:var(--muted-2);}
  .status-dot{width:6px; height:6px; border-radius:50%; background:var(--muted-2);}
  .status-dot.online{background:var(--lime);}
  .status-dot.offline{background:var(--danger);}
</style>
</head>
<body>

<header class="topbar">
  <button class="icon-btn" onclick="window.location.href='home.html'" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="topbar-title">Deposit</div>
</header>

<main class="main">
  <div class="avail-card">
    <div>
      <div class="avail-label">Current Balance</div>
      <div class="avail-value" id="currentBalance">KES 0.00</div>
    </div>
    <div style="font-size:22px;">💳</div>
  </div>

  <div class="field-label">Enter amount</div>
  <div class="amount-card">
    <div class="amount-input-row">
      <span class="amount-cur">KES</span>
      <input class="amount-input" id="amountInput" type="number" inputmode="numeric" placeholder="0" />
    </div>
    <div class="limits-note">Min <b>KES 10</b> &nbsp;·&nbsp; Max <b>KES 70,000</b> per transaction</div>
  </div>
  <div class="error-msg" id="amountError"></div>

  <div class="chip-row">
    <div class="chip" data-amt="100">100</div>
    <div class="chip" data-amt="500">500</div>
    <div class="chip" data-amt="1000">1,000</div>
    <div class="chip" data-amt="5000">5,000</div>
    <div class="chip" data-amt="70000">Max</div>
  </div>

  <div class="field-label">M-Pesa phone number</div>
  <div class="phone-card">
    <div class="phone-row">
      <div class="phone-prefix">🇰🇪 +254</div>
      <input class="phone-input" id="phoneInput" type="tel" placeholder="7XX XXX XXX" inputmode="numeric" />
    </div>
  </div>

  <button class="submit-btn" id="submitBtn">Send STK Push</button>

  <div class="status-note">
    <span class="status-dot" id="connDot"></span>
    <span id="connText">Checking connection…</span>
  </div>
</main>

<!-- STK waiting / result overlay -->
<div class="stk-overlay" id="stkOverlay">
  <div id="waitingView">
    <div class="stk-phone">📲</div>
    <div class="stk-title">Check your phone</div>
    <div class="stk-sub">Enter your M-Pesa PIN on the prompt sent to <span id="stkPhoneDisplay"></span> to complete the deposit.</div>
    <div class="stk-status"><span class="stk-spinner"></span> Waiting for confirmation…</div>
    <div class="stk-cancel" id="stkCancelBtn">Cancel</div>
  </div>

  <div class="stk-result" id="stkResult">
    <div class="stk-result-icon" id="stkResultIcon"></div>
    <div class="stk-title" id="stkResultTitle"></div>
    <div class="stk-sub" id="stkResultSub"></div>
    <button class="stk-close-btn" id="stkCloseBtn">Done</button>
  </div>
</div>

<script>
  const API_BASE = window.BETAWIN_API_BASE || 'http://localhost:5000';
  const token = localStorage.getItem('betawin_token');
  const MIN = 10, MAX = 70000;
  function authHeaders(extra){ const h = token ? { 'Authorization': 'Bearer ' + token } : {}; return extra ? {...h, 'Content-Type':'application/json'} : h; }

  async function loadBalance(){
    const el = document.getElementById('currentBalance');
    try{
      const res = await fetch(API_BASE + '/api/wallet/balance', { headers: authHeaders() });
      if(!res.ok) throw new Error();
      const data = await res.json();
      el.textContent = 'KES ' + Number(data.balance || 0).toLocaleString('en-KE', { minimumFractionDigits: 2 });
    } catch(e){ el.textContent = 'KES 0.00'; }
  }
  loadBalance();

  async function pollHealth(){
    const dot = document.getElementById('connDot'), txt = document.getElementById('connText');
    try{
      const res = await fetch(API_BASE + '/health');
      if(!res.ok) throw new Error();
      dot.className = 'status-dot online'; txt.textContent = 'Connected';
    } catch(e){ dot.className = 'status-dot offline'; txt.textContent = 'Offline — retrying…'; }
  }
  pollHealth(); setInterval(pollHealth, 15000);

  const amountInput = document.getElementById('amountInput');
  const amountError = document.getElementById('amountError');
  const phoneInput = document.getElementById('phoneInput');
  const submitBtn = document.getElementById('submitBtn');

  function validate(){
    const val = Number(amountInput.value);
    if(!amountInput.value){ amountError.classList.remove('show'); submitBtn.classList.remove('enabled'); return false; }
    if(val < MIN){ amountError.textContent = `Minimum deposit is KES ${MIN}`; amountError.classList.add('show'); submitBtn.classList.remove('enabled'); return false; }
    if(val > MAX){ amountError.textContent = `Maximum deposit is KES ${MAX.toLocaleString()}`; amountError.classList.add('show'); submitBtn.classList.remove('enabled'); return false; }
    const phoneOk = /^[71]\d{8}$/.test(phoneInput.value.trim());
    if(phoneInput.value && !phoneOk){ amountError.textContent = 'Enter a valid phone number (e.g. 712345678)'; amountError.classList.add('show'); submitBtn.classList.remove('enabled'); return false; }
    amountError.classList.remove('show');
    submitBtn.classList.toggle('enabled', phoneOk);
    return phoneOk;
  }
  amountInput.addEventListener('input', validate);
  phoneInput.addEventListener('input', validate);

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      amountInput.value = chip.dataset.amt;
      validate();
    });
  });

  // ---------- STK push flow ----------
  const stkOverlay = document.getElementById('stkOverlay');
  const waitingView = document.getElementById('waitingView');
  const stkResult = document.getElementById('stkResult');
  let pollTimer = null;

  function showWaiting(phone){
    document.getElementById('stkPhoneDisplay').textContent = '+254 ' + phone;
    waitingView.style.display = 'flex';
    waitingView.style.flexDirection = 'column';
    waitingView.style.alignItems = 'center';
    stkResult.classList.remove('show');
    stkOverlay.classList.add('show');
  }

  function showResult(success, title, sub){
    waitingView.style.display = 'none';
    document.getElementById('stkResultIcon').className = 'stk-result-icon ' + (success ? 'success' : 'failed');
    document.getElementById('stkResultIcon').textContent = success ? '✓' : '✕';
    document.getElementById('stkResultTitle').textContent = title;
    document.getElementById('stkResultSub').textContent = sub;
    stkResult.classList.add('show');
  }

  function closeOverlay(){
    stkOverlay.classList.remove('show');
    clearInterval(pollTimer);
  }
  document.getElementById('stkCloseBtn').addEventListener('click', () => { closeOverlay(); loadBalance(); });
  document.getElementById('stkCancelBtn').addEventListener('click', closeOverlay);

  async function pollStatus(checkoutRequestId, phone){
    let attempts = 0;
    pollTimer = setInterval(async () => {
      attempts++;
      try{
        const res = await fetch(`${API_BASE}/api/payments/mpesa/status/${checkoutRequestId}`, { headers: authHeaders() });
        const data = await res.json();
        if(data.status === 'completed'){
          clearInterval(pollTimer);
          showResult(true, 'Deposit successful', `KES ${data.amount.toLocaleString()} has been added to your wallet.`);
        } else if(data.status === 'failed'){
          clearInterval(pollTimer);
          showResult(false, 'Deposit not completed', 'The M-Pesa payment was cancelled or timed out. You can try again.');
        }
      } catch(e){ /* keep polling */ }

      if(attempts > 40){ // ~2 minutes at 3s interval
        clearInterval(pollTimer);
        showResult(false, 'Still waiting', 'This is taking longer than expected. Check your M-Pesa messages — your balance will update automatically once confirmed.');
      }
    }, 3000);
  }

  submitBtn.addEventListener('click', async () => {
    if(!validate()) return;
    const amount = Number(amountInput.value);
    const phone = phoneInput.value.trim();

    showWaiting(phone);

    try{
      const res = await fetch(API_BASE + '/api/payments/mpesa/stkpush', {
        method: 'POST',
        headers: authHeaders(true),
        body: JSON.stringify({ amount, phone })
      });
      const data = await res.json();
      if(!res.ok || !data.success) throw new Error(data.message || 'Request failed');
      pollStatus(data.checkoutRequestId, phone);
    } catch(e){
      showResult(false, 'Could not send STK push', e.message || 'Check your connection and try again once the backend is set up.');
    }
  });
</script>

</body>
                                            </html>
