<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Betawin — Profile</title>
<style>
  :root{
    --bg:#0A0E12; --panel:#141C26; --line:#223040; --lime:#B4FF39; --lime-dim:#8FDB1E;
    --text:#EDF2F7; --muted:#7C8998; --muted-2:#4E5B6B; --danger:#FF6B6B; --warn:#F4C542;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif; height:100%;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  a{color:inherit; text-decoration:none;}
  input{font-family:inherit;}

  .topbar{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:14px 16px; background:rgba(10,14,18,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
  .icon-btn{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--panel); border:1px solid var(--line);}
  .icon-btn svg{width:19px; height:19px; stroke:var(--text);}
  .topbar-title{font-weight:700; font-size:16px;}

  .main{padding:18px 16px 90px; max-width:520px; margin:0 auto;}

  .profile-hero{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:26px 16px; margin-bottom:18px;
  }
  .avatar-lg{
    width:76px; height:76px; border-radius:50%; background:var(--panel); border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; color:var(--lime);
    margin-bottom:12px;
  }
  .profile-name{font-size:19px; font-weight:700;}
  .profile-sub{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .verify-badge{
    display:inline-flex; align-items:center; gap:6px; margin-top:10px;
    padding:5px 12px; border-radius:20px; font-size:11px; font-weight:700;
  }
  .verify-badge.unverified{background:rgba(244,197,66,0.12); color:var(--warn);}
  .verify-badge.verified{background:rgba(180,255,57,0.12); color:var(--lime);}

  .section-label{font-size:11px; color:var(--muted-2); text-transform:uppercase; letter-spacing:1.2px; margin:20px 0 10px; padding:0 4px;}
  .info-card{background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden;}
  .info-row{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-top:1px solid var(--line);}
  .info-row:first-child{border-top:none;}
  .info-key{font-size:13px; color:var(--muted); display:flex; align-items:center; gap:10px;}
  .info-key svg{width:16px; height:16px; opacity:.75;}
  .info-val{font-size:13.5px; font-weight:600;}
  .info-val.empty{color:var(--muted-2); font-weight:500;}
  .row-btn{display:flex; align-items:center; justify-content:space-between; width:100%; padding:14px 16px;}
  .row-arrow{color:var(--muted-2); font-size:14px;}

  .edit-card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:8px;}
  .field{margin-bottom:12px;}
  .field-label{font-size:11.5px; color:var(--muted); margin-bottom:6px; display:block;}
  .field-input{width:100%; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:11px 12px; color:var(--text); font-size:13.5px;}
  .field-input:focus{outline:none; border-color:var(--lime);}
  .save-btn{width:100%; background:var(--lime); color:#0A0E12; font-weight:700; font-size:13.5px; padding:12px; border-radius:10px; text-align:center; margin-top:4px;}
  .save-btn:active{background:var(--lime-dim);}
  .save-note{font-size:11px; color:var(--muted-2); text-align:center; margin-top:8px; display:none;}
  .save-note.show{display:block; color:var(--lime);}

  .status-note{display:flex; align-items:center; gap:6px; justify-content:center; margin-top:20px; font-size:11px; color:var(--muted-2);}
  .status-dot{width:6px; height:6px; border-radius:50%; background:var(--muted-2);}
  .status-dot.online{background:var(--lime);}
  .status-dot.offline{background:var(--danger);}
</style>
</head>
<body>

<header class="topbar">
  <button class="icon-btn" onclick="window.location.href='index.html'" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="topbar-title">Profile</div>
</header>

<main class="main">
  <div class="profile-hero">
    <div class="avatar-lg" id="avatarInitials">–</div>
    <div class="profile-name" id="profileName">Guest</div>
    <div class="profile-sub" id="profileSub">No account details yet</div>
    <div class="verify-badge unverified" id="verifyBadge">● Not Verified</div>
  </div>

  <div class="section-label">Account details</div>
  <div class="info-card">
    <div class="info-row">
      <div class="info-key">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/></svg>
        Email
      </div>
      <div class="info-val empty" id="valEmail">Not set</div>
    </div>
    <div class="info-row">
      <div class="info-key">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1.9.3 1.8.6 2.7a2 2 0 01-.4 2.1L8 9.9a16 16 0 006 6l1.4-1.4a2 2 0 012.1-.4c.9.3 1.8.5 2.7.6a2 2 0 011.8 2.2z"/></svg>
        Phone
      </div>
      <div class="info-val empty" id="valPhone">Not set</div>
    </div>
    <div class="info-row">
      <div class="info-key">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.4 14.5L16 10l-9.5 9.5"/><circle cx="12" cy="12" r="10"/></svg>
        Country
      </div>
      <div class="info-val" id="valCountry">Kenya</div>
    </div>
    <div class="info-row">
      <div class="info-key">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
        Member since
      </div>
      <div class="info-val" id="valSince">—</div>
    </div>
  </div>

  <div class="section-label">Edit details</div>
  <div class="edit-card">
    <div class="field">
      <label class="field-label">Full name</label>
      <input class="field-input" id="editName" placeholder="Your full name" />
    </div>
    <div class="field">
      <label class="field-label">Email</label>
      <input class="field-input" id="editEmail" type="email" placeholder="you@example.com" />
    </div>
    <div class="field">
      <label class="field-label">Phone</label>
      <input class="field-input" id="editPhone" type="tel" placeholder="07XX XXX XXX" />
    </div>
    <button class="save-btn" id="saveBtn">Save Changes</button>
    <div class="save-note" id="saveNote">Saved</div>
  </div>

  <div class="section-label">Actions</div>
  <div class="info-card">
    <a class="row-btn" data-page="settings.html">
      <span class="info-key">Account settings</span>
      <span class="row-arrow">→</span>
    </a>
    <a class="row-btn" style="border-top:1px solid var(--line)" data-page="activity.html">
      <span class="info-key">My activity</span>
      <span class="row-arrow">→</span>
    </a>
  </div>

  <div class="status-note">
    <span class="status-dot" id="connDot"></span>
    <span id="connText">Checking connection…</span>
  </div>
</main>

<script>
  const API_BASE = window.BETAWIN_API_BASE || 'http://localhost:5000';
  const token = localStorage.getItem('betawin_token');
  function authHeaders(){ return token ? { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' }; }

  function getUser(){
    try{ return JSON.parse(localStorage.getItem('betawin_user') || 'null'); }catch(e){ return null; }
  }

  function renderUser(){
    const u = getUser();
    const name = u && u.name ? u.name : 'Guest';
    document.getElementById('profileName').textContent = name;
    document.getElementById('avatarInitials').textContent = name === 'Guest' ? '–' : name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
    document.getElementById('profileSub').textContent = u ? (u.email || u.phone || 'No account details yet') : 'No account details yet';
    document.getElementById('valEmail').textContent = u && u.email ? u.email : 'Not set';
    document.getElementById('valEmail').classList.toggle('empty', !(u && u.email));
    document.getElementById('valPhone').textContent = u && u.phone ? u.phone : 'Not set';
    document.getElementById('valPhone').classList.toggle('empty', !(u && u.phone));
    document.getElementById('valSince').textContent = u && u.createdAt ? new Date(u.createdAt).toLocaleDateString('en-KE', {month:'short', year:'numeric'}) : '—';
    document.getElementById('editName').value = u && u.name ? u.name : '';
    document.getElementById('editEmail').value = u && u.email ? u.email : '';
    document.getElementById('editPhone').value = u && u.phone ? u.phone : '';

    const badge = document.getElementById('verifyBadge');
    if(u && u.verified){
      badge.className = 'verify-badge verified'; badge.textContent = '● Verified';
    } else {
      badge.className = 'verify-badge unverified'; badge.textContent = '● Not Verified';
    }
  }
  renderUser();

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const payload = {
      name: document.getElementById('editName').value.trim(),
      email: document.getElementById('editEmail').value.trim(),
      phone: document.getElementById('editPhone').value.trim(),
    };
    try{
      const res = await fetch(API_BASE + '/api/profile', { method:'PUT', headers: authHeaders(), body: JSON.stringify(payload) });
      if(!res.ok) throw new Error();
      const data = await res.json();
      localStorage.setItem('betawin_user', JSON.stringify(data.user || payload));
    } catch(e){
      // Backend not connected yet — save locally so the UI still reflects the edit
      const existing = getUser() || {};
      localStorage.setItem('betawin_user', JSON.stringify({ ...existing, ...payload }));
    }
    renderUser();
    const note = document.getElementById('saveNote');
    note.classList.add('show');
    setTimeout(() => note.classList.remove('show'), 2000);
  });

  document.querySelectorAll('[data-page]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      const target = el.dataset.page;
      fetch(target, { method:'HEAD' }).then(res => {
        if(res.ok) window.location.href = target;
      }).catch(()=>{});
    });
  });

  async function pollHealth(){
    const dot = document.getElementById('connDot'), txt = document.getElementById('connText');
    try{
      const res = await fetch(API_BASE + '/health', { headers: authHeaders() });
      if(!res.ok) throw new Error();
      dot.className = 'status-dot online'; txt.textContent = 'Connected';
    } catch(e){ dot.className = 'status-dot offline'; txt.textContent = 'Offline — retrying…'; }
  }
  pollHealth(); setInterval(pollHealth, 15000);
</script>

</body>
</html>
