<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions — Betawin</title>
<style>
  :root{
    --navy-900:#0a0e17; --navy-800:#101624; --navy-700:#161d2f; --navy-600:#1e2740;
    --line:#232c42; --lime:#c6ff3d; --lime-dim:#8fbf2c; --red:#ff4d4d;
    --text:#eef1f8; --text-dim:#8891a7; --text-faint:#5a6379; --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--navy-900); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100vh; padding-bottom:40px;}
  .topbar{position:sticky; top:0; z-index:20; background:rgba(10,14,23,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:14px 16px;}
  .topbar-row{display:flex; align-items:center; gap:12px; max-width:720px; margin:0 auto;}
  .back-btn{width:34px; height:34px; background:var(--navy-800); border:1px solid var(--line); border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--text); cursor:pointer; text-decoration:none;}
  .page-title{font-size:17px; font-weight:800;}

  main{max-width:720px; margin:0 auto; padding:16px;}

  .balance-strip{
    background:linear-gradient(135deg, var(--navy-700), var(--navy-800));
    border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; margin-bottom:18px; text-align:center;
  }
  .balance-label{font-size:11px; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:0.06em;}
  .balance-value{font-size:26px; font-weight:800; color:var(--lime); margin-top:4px;}

  .filter-row{display:flex; gap:8px; overflow-x:auto; margin-bottom:16px; scrollbar-width:none;}
  .filter-row::-webkit-scrollbar{display:none;}
  .filter-chip{
    flex:0 0 auto; padding:8px 14px; border-radius:999px;
    background:var(--navy-700); border:1px solid var(--line);
    color:var(--text-dim); font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .filter-chip.active{background:var(--lime); color:var(--navy-900); border-color:var(--lime);}

  .day-group{margin-bottom:18px;}
  .day-label{
    font-size:11px; color:var(--text-faint); font-weight:700;
    text-transform:uppercase; letter-spacing:0.06em; padding:4px 4px 8px;
  }

  .txn-row{
    display:flex; align-items:center; gap:12px;
    background:var(--navy-800); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; margin-bottom:8px;
    cursor:pointer;
  }
  .txn-icon{
    width:38px; height:38px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; flex-shrink:0;
  }
  .txn-icon.deposit{background:rgba(198,255,61,0.1);}
  .txn-icon.withdraw{background:rgba(255,77,77,0.1);}
  .txn-icon.bet{background:rgba(136,145,167,0.12);}
  .txn-icon.win{background:rgba(198,255,61,0.1);}
  .txn-icon.bonus{background:rgba(255,193,77,0.1);}

  .txn-body{flex:1; min-width:0;}
  .txn-title{font-size:13px; font-weight:700;}
  .txn-sub{font-size:11px; color:var(--text-faint); margin-top:2px;}

  .txn-right{text-align:right; flex-shrink:0;}
  .txn-amount{font-size:13px; font-weight:800;}
  .txn-amount.pos{color:var(--lime);}
  .txn-amount.neg{color:var(--red);}
  .txn-status{font-size:10px; color:var(--text-faint); margin-top:2px; text-transform:uppercase;}
  .txn-status.pending{color:#ffc14d;}
  .txn-status.failed{color:var(--red);}

  .empty{text-align:center; padding:60px 20px; color:var(--text-faint);}
  .empty-icon{font-size:32px; margin-bottom:10px;}
  .empty-title{font-size:15px; font-weight:700; color:var(--text-dim); margin-bottom:4px;}
  .empty-sub{font-size:13px;}

  .skeleton{
    background:var(--navy-800); border:1px solid var(--line); border-radius:12px;
    height:62px; margin-bottom:8px; position:relative; overflow:hidden;
  }
  .skeleton::after{
    content:""; position:absolute; top:0; left:-100%; width:100%; height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
    animation:shimmer 1.3s infinite;
  }
  @keyframes shimmer{100%{left:100%;}}

  /* ---------- Detail sheet ---------- */
  .overlay{
    position:fixed; inset:0; z-index:30; background:rgba(0,0,0,0.55);
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:31;
    background:var(--navy-800); border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .25s ease;
    max-width:720px; margin:0 auto;
  }
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:99px; margin:0 auto 16px;}
  .sheet-row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .sheet-row:last-child{border-bottom:none;}
  .sheet-row .sk{color:var(--text-dim);}
  .sheet-row .sv{font-weight:700;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <a class="back-btn" href="dashboard.html">←</a>
    <div class="page-title">Transactions</div>
  </div>
</div>

<main>
  <div class="balance-strip">
    <div class="balance-label">Current balance</div>
    <div class="balance-value" id="balanceValue">KES 0.00</div>
  </div>

  <div class="filter-row" id="filterRow">
    <div class="filter-chip active" data-filter="all">All</div>
    <div class="filter-chip" data-filter="deposit">Deposits</div>
    <div class="filter-chip" data-filter="withdraw">Withdrawals</div>
    <div class="filter-chip" data-filter="bet">Bets</div>
    <div class="filter-chip" data-filter="win">Winnings</div>
    <div class="filter-chip" data-filter="bonus">Bonuses</div>
  </div>

  <div id="txnRoot">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</main>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div id="sheetBody"></div>
</div>

<script>
  const API_BASE = "";

  function getToken(){ return localStorage.getItem("betawin_token"); }

  // Demo dataset — replace with a real /api/wallet/transactions endpoint
  // once your ledger exists on the backend. No real-money transactions
  // are processed on this page; it's read-only history display.
  const TRANSACTIONS = [
    { id: "tx_1001", type: "deposit", title: "M-Pesa Deposit", ref: "SFA7X2KQ1P", amount: 500, status: "completed", date: "2026-08-19T08:12:00" },
    { id: "tx_1002", type: "bet", title: "Bet Placed — Man City vs Arsenal", ref: "BET-88231", amount: -100, status: "completed", date: "2026-08-19T07:40:00" },
    { id: "tx_1003", type: "win", title: "Bet Won — Man City vs Arsenal", ref: "BET-88231", amount: 240, status: "completed", date: "2026-08-19T09:55:00" },
    { id: "tx_1004", type: "bonus", title: "Welcome Free Bet Credited", ref: "PROMO-WELCOME", amount: 100, status: "completed", date: "2026-08-18T14:02:00" },
    { id: "tx_1005", type: "withdraw", title: "M-Pesa Withdrawal", ref: "WD-55210", amount: -300, status: "pending", date: "2026-08-18T11:30:00" },
    { id: "tx_1006", type: "bet", title: "Bet Placed — Aviator", ref: "BET-88190", amount: -50, status: "completed", date: "2026-08-17T20:15:00" },
    { id: "tx_1007", type: "withdraw", title: "M-Pesa Withdrawal", ref: "WD-55190", amount: -200, status: "failed", date: "2026-08-16T18:44:00" },
    { id: "tx_1008", type: "deposit", title: "M-Pesa Deposit", ref: "SFA7X1AB9K", amount: 1000, status: "completed", date: "2026-08-15T09:05:00" }
  ];

  const ICONS = {
    deposit: "⬇️", withdraw: "⬆️", bet: "🎫", win: "🏆", bonus: "🎁"
  };

  let activeFilter = "all";

  function groupByDay(txns){
    const groups = {};
    txns.forEach(t => {
      const d = new Date(t.date);
      const key = d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
      if(!groups[key]) groups[key] = [];
      groups[key].push(t);
    });
    return groups;
  }

  function renderList(){
    const root = document.getElementById("txnRoot");
    const filtered = activeFilter === "all"
      ? TRANSACTIONS
      : TRANSACTIONS.filter(t => t.type === activeFilter);

    if(filtered.length === 0){
      root.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🧾</div>
          <div class="empty-title">No transactions found</div>
          <div class="empty-sub">Try a different filter</div>
        </div>`;
      return;
    }

    const sorted = [...filtered].sort((a, b) => new Date(b.date) - new Date(a.date));
    const groups = groupByDay(sorted);

    root.innerHTML = "";
    Object.entries(groups).forEach(([day, items]) => {
      const section = document.createElement("div");
      section.className = "day-group";
      section.innerHTML = `<div class="day-label">${day}</div>`;

      items.forEach(t => {
        const isPositive = t.amount > 0;
        const time = new Date(t.date).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        const row = document.createElement("div");
        row.className = "txn-row";
        row.innerHTML = `
          <div class="txn-icon ${t.type}">${ICONS[t.type] || "💳"}</div>
          <div class="txn-body">
            <div class="txn-title">${t.title}</div>
            <div class="txn-sub">${time}</div>
          </div>
          <div class="txn-right">
            <div class="txn-amount ${isPositive ? "pos" : "neg"}">${isPositive ? "+" : ""}KES ${Math.abs(t.amount).toLocaleString()}</div>
            <div class="txn-status ${t.status}">${t.status}</div>
          </div>
        `;
        row.addEventListener("click", () => openSheet(t));
        section.appendChild(row);
      });

      root.appendChild(section);
    });
  }

  function updateBalance(){
    const total = TRANSACTIONS
      .filter(t => t.status === "completed")
      .reduce((sum, t) => sum + t.amount, 0);
    document.getElementById("balanceValue").textContent =
      `KES ${total.toLocaleString(undefined, { minimumFractionDigits: 2 })}`;
  }

  const overlay = document.getElementById("overlay");
  const sheet = document.getElementById("sheet");

  function openSheet(t){
    const isPositive = t.amount > 0;
    document.getElementById("sheetBody").innerHTML = `
      <div class="sheet-row"><span class="sk">Description</span><span class="sv">${t.title}</span></div>
      <div class="sheet-row"><span class="sk">Amount</span><span class="sv" style="color:${isPositive ? "var(--lime)" : "var(--red)"}">${isPositive ? "+" : ""}KES ${Math.abs(t.amount).toLocaleString()}</span></div>
      <div class="sheet-row"><span class="sk">Reference</span><span class="sv">${t.ref}</span></div>
      <div class="sheet-row"><span class="sk">Status</span><span class="sv">${t.status}</span></div>
      <div class="sheet-row"><span class="sk">Date</span><span class="sv">${new Date(t.date).toLocaleString()}</span></div>
    `;
    sheet.classList.add("open");
    overlay.classList.add("open");
  }
  function closeSheet(){
    sheet.classList.remove("open");
    overlay.classList.remove("open");
  }
  overlay.addEventListener("click", closeSheet);

  document.getElementById("filterRow").addEventListener("click", (e) => {
    const chip = e.target.closest(".filter-chip");
    if(!chip) return;
    document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    activeFilter = chip.dataset.filter;
    renderList();
  });

  function init(){
    const token = getToken();
    if(!token){
      window.location.href = "login.html";
      return;
    }
    updateBalance();
    renderList();
  }

  init();
</script>
</body>
      </html>
