<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Betawin — Casino</title>
<style>
  :root{
    --bg:#0A0E12; --panel:#141C26; --line:#223040; --lime:#B4FF39; --lime-dim:#8FDB1E;
    --text:#EDF2F7; --muted:#7C8998; --muted-2:#4E5B6B; --danger:#FF6B6B;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif; height:100%;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  a{color:inherit; text-decoration:none;}
  input{font-family:inherit;}

  .topbar{position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:rgba(10,14,18,0.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
  .topbar-left{display:flex; align-items:center; gap:12px;}
  .icon-btn{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--panel); border:1px solid var(--line); flex-shrink:0;}
  .icon-btn svg{width:19px; height:19px; stroke:var(--text);}
  .topbar-title{font-weight:700; font-size:16px;}
  .brand-mark{width:30px; height:30px; border-radius:8px; background:var(--lime); color:#0A0E12; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; flex-shrink:0;}

  .main{padding:18px 16px 90px; max-width:560px; margin:0 auto;}

  .hero{
    position:relative; overflow:hidden;
    background:radial-gradient(120% 140% at 15% 0%, rgba(244,197,66,0.14), transparent 55%), var(--panel);
    border:1px solid var(--line); border-radius:18px; padding:22px 20px; margin-bottom:20px;
    display:flex; align-items:center; gap:14px;
    animation:fadeSlideDown .5s ease both;
  }
  .hero-logo{
    width:52px; height:52px; border-radius:14px; flex-shrink:0;
    background:linear-gradient(150deg, #F4C542, #C98A2E);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px; color:#0A0E12;
    box-shadow:0 0 22px rgba(244,197,66,0.25);
    animation:float 3.2s ease-in-out infinite;
  }
  .hero-title{font-size:17px; font-weight:800; letter-spacing:.3px;}
  .hero-sub{font-size:12px; color:var(--muted); margin-top:2px;}

  @keyframes fadeSlideDown{from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:translateY(0);}}
  @keyframes float{0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);}}

  .search-box{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:11px 14px; margin-bottom:18px; color:var(--muted-2); font-size:13px;}
  .search-box svg{width:15px; height:15px; opacity:.6; flex-shrink:0;}
  .search-box input{flex:1; background:none; border:none; outline:none; color:var(--text); font-size:13px;}
  .search-box input::placeholder{color:var(--muted-2);}

  .category-tabs{display:flex; gap:8px; margin-bottom:16px; overflow-x:auto;}
  .cat-tab{flex-shrink:0; padding:8px 15px; border-radius:20px; font-size:12.5px; font-weight:600; background:var(--panel); border:1px solid var(--line); color:var(--muted);}
  .cat-tab.active{background:var(--lime); color:#0A0E12; border-color:var(--lime);}

  .section-label{font-size:11px; color:var(--muted-2); text-transform:uppercase; letter-spacing:1.2px; margin:18px 4px 10px;}
  .section-label:first-of-type{margin-top:0;}

  .game-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .game-card{
    position:relative; overflow:hidden;
    background:var(--panel); border:1px solid var(--line); border-radius:15px;
    padding:14px; display:flex; flex-direction:column; gap:8px;
    transition:border-color .15s, transform .1s;
    opacity:0; animation:cardIn .45s ease forwards;
  }
  .game-card:active{transform:scale(0.97);}
  .game-card.ready{border-color:rgba(180,255,57,0.32);}
  @keyframes cardIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  .game-logo{width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:20px;}
  .game-title{font-weight:700; font-size:13.5px; line-height:1.25;}
  .game-sub{font-size:10.5px; color:var(--muted); line-height:1.4;}
  .game-status{font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted-2); margin-top:2px;}
  .game-card.ready .game-status{color:var(--lime);}

  .status-note{display:flex; align-items:center; gap:6px; justify-content:center; margin-top:22px; font-size:11px; color:var(--muted-2);}
  .status-dot{width:6px; height:6px; border-radius:50%; background:var(--muted-2);}
  .status-dot.online{background:var(--lime);}
  .status-dot.offline{background:var(--danger);}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <button class="icon-btn" onclick="window.location.href='games.html'" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="topbar-title">Casino</div>
  </div>
  <div class="brand-mark">B</div>
</header>

<main class="main">
  <div class="hero">
    <div class="hero-logo">B</div>
    <div>
      <div class="hero-title">BETAWIN CASINO</div>
      <div class="hero-sub">Slots, table games &amp; live dealers</div>
    </div>
  </div>

  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
    <input id="searchInput" placeholder="Search casino games…" />
  </div>

  <div class="category-tabs" id="catTabs">
    <div class="cat-tab active" data-cat="all">All</div>
    <div class="cat-tab" data-cat="slots">Slots</div>
    <div class="cat-tab" data-cat="table">Table</div>
    <div class="cat-tab" data-cat="live">Live Casino</div>
    <div class="cat-tab" data-cat="jackpot">Jackpots</div>
  </div>

  <div class="section-label">Games</div>
  <div class="game-grid" id="gameGrid"></div>

  <div class="status-note">
    <span class="status-dot" id="connDot"></span>
    <span id="connText">Checking connection…</span>
  </div>
</main>

<script>
  const API_BASE = window.BETAWIN_API_BASE || 'http://localhost:5000';
  const token = localStorage.getItem('betawin_token');
  function authHeaders(){ return token ? { 'Authorization': 'Bearer ' + token } : {}; }

  const games = [
    { name:'Roulette',        slug:'roulette',        icon:'🎡', cat:'table',   color:'rgba(180,255,57,0.14)', sub:'Bet on the wheel' },
    { name:'Blackjack',       slug:'blackjack',       icon:'🃏', cat:'table',   color:'rgba(45,212,191,0.14)', sub:'Beat the dealer to 21' },
    { name:'Baccarat',        slug:'baccarat',        icon:'🎴', cat:'table',   color:'rgba(244,197,66,0.14)', sub:'Player vs Banker classic' },
    { name:'Poker',           slug:'poker',           icon:'♠️', cat:'table',   color:'rgba(255,107,107,0.14)', sub:'Texas Hold\'em tables' },
    { name:'Classic Slots',   slug:'classic-slots',   icon:'🎰', cat:'slots',   color:'rgba(180,255,57,0.14)', sub:'Fruit reels, big wins' },
    { name:'Mega Slots',      slug:'mega-slots',      icon:'💎', cat:'slots',   color:'rgba(45,212,191,0.14)', sub:'High volatility spins' },
    { name:'Book of Fortune', slug:'book-of-fortune', icon:'📖', cat:'slots',   color:'rgba(244,197,66,0.14)', sub:'Ancient treasures slot' },
    { name:'Fruit Rush',      slug:'fruit-rush',      icon:'🍇', cat:'slots',   color:'rgba(255,107,107,0.14)', sub:'Fast fruit-themed slot' },
    { name:'Live Roulette',   slug:'live-roulette',   icon:'📺', cat:'live',    color:'rgba(180,255,57,0.14)', sub:'Real dealer, live table' },
    { name:'Live Blackjack',  slug:'live-blackjack',  icon:'🎥', cat:'live',    color:'rgba(45,212,191,0.14)', sub:'Live dealer 21' },
    { name:'Live Baccarat',   slug:'live-baccarat',   icon:'🎬', cat:'live',    color:'rgba(244,197,66,0.14)', sub:'Live dealer baccarat' },
    { name:'Mega Jackpot',    slug:'mega-jackpot',    icon:'💰', cat:'jackpot', color:'rgba(180,255,57,0.14)', sub:'Progressive grand prize' },
    { name:'Daily Jackpot',   slug:'daily-jackpot',   icon:'🏆', cat:'jackpot', color:'rgba(244,197,66,0.14)', sub:'Fresh jackpot every day' },
  ];

  const grid = document.getElementById('gameGrid');
  let currentCat = 'all';

  function renderGrid(){
    const filtered = currentCat === 'all' ? games : games.filter(g => g.cat === currentCat);
    grid.innerHTML = filtered.map((g, i) => `
      <a class="game-card" style="animation-delay:${i * 0.04}s" data-page="${g.slug}.html" data-name="${g.name.toLowerCase()}">
        <div class="game-logo" style="background:${g.color}">${g.icon}</div>
        <div class="game-title">${g.name}</div>
        <div class="game-sub">${g.sub}</div>
        <div class="game-status" data-status>Coming soon</div>
      </a>
    `).join('');

    grid.querySelectorAll('.game-card').forEach(card => {
      const target = card.dataset.page;
      fetch(target, { method: 'HEAD' })
        .then(res => {
          if(res.ok){
            card.classList.add('ready');
            card.querySelector('[data-status]').textContent = 'Play now →';
            card.addEventListener('click', () => window.location.href = target);
          }
        })
        .catch(() => {});
    });
  }
  renderGrid();

  document.querySelectorAll('.cat-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentCat = tab.dataset.cat;
      renderGrid();
    });
  });

  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    grid.querySelectorAll('.game-card').forEach(card => {
      card.style.display = card.dataset.name.includes(q) ? '' : 'none';
    });
  });

  async function pollHealth(){
    const dot = document.getElementById('connDot'), txt = document.getElementById('connText');
    try{
      const res = await fetch(API_BASE + '/health', { headers: authHeaders() });
      if(!res.ok) throw new Error();
      dot.className = 'status-dot online'; txt.textContent = 'Connected';
    } catch(e){ dot.className = 'status-dot offline'; txt.textContent = 'Offline — retrying…'; }
  }
  pollHealth(); setInterval(pollHealth, 15000);
</script>

</body>
</html>
